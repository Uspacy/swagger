# tasksService OpenAPI paths and definitions
# This file was separated from api.yml for modularity.

openapi: 3.0.0
info:
  title: Tasks Service
  version: 1.0.0
paths:
  /tasks/v1/tasks:
    get:
      summary: Get available tasks list
      description: Get available tasks list
      tags:
        - tasksService
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/list"
        - in: query
          name: parent_id
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
          example: expecting
        - in: query
          name: status
          schema:
            type: array
            items:
              type: string
          example: ["suspended", "not_planned"]
        - in: query
          name: setter_id
          schema:
            type: string
        - in: query
          name: responsible_id
          schema:
            type: string
        - in: query
          name: accomplices
          schema:
            type: string
        - in: query
          name: group_id
          schema:
            type: string
        - in: query
          name: stages
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
        - in: query
          name: deadline
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      summary: Create task
      description: Create task
      tags:
        - tasksService
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Created
      security:
        - bearerAuth: []
  /tasks/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/taskId"
    get:
      summary: Get task by id
      description: Get task by id
      tags:
        - tasksService
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
    patch:
      summary: Edit task by id
      description: Edit task by id
      tags:
        - tasksService
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
    delete:
      summary: Delete task by id
      description: Delete task by id
      tags:
        - tasksService
      responses:
        "204":
          description: No content
      security:
        - bearerAuth: []
  /tasks/v1/stages:
    get:
      summary: Get kanban stages
      description: Get kanban stages
      tags:
        - tasksService
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
    post:
      summary: Create kanban stage
      description: Create kanban stage
      tags:
        - tasksService
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
  /tasks/v1/stages/{stageId}:
    get:
      summary: Get kanban stage by id
      description: Get kanban stage by id
      tags:
        - tasksService
      parameters:
        - $ref: "#/components/parameters/stageId"
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
    patch:
      summary: Update kanban stage by id
      description: Update kanban stage by id
      tags:
        - tasksService
      parameters:
        - $ref: "#/components/parameters/stageId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
      security:
        - bearerAuth: []
    delete:
      summary: Delete kanban stage by id
      description: Create kanban stage by id
      tags:
        - tasksService
      parameters:
        - $ref: "#/components/parameters/stageId"
      responses:
        "204":
          description: No content
      security:
        - bearerAuth: []
# tasks end

components:
  parameters:
    page:
      name: page
      in: query
      description: Page number for pagination
      required: false
      schema:
        type: integer
        minimum: 1
    list:
      name: list
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        minimum: 1
    taskId:
      name: taskId
      in: path
      description: ID of the task
      required: true
      schema:
        type: string
    stageId:
      name: stageId
      in: path
      description: ID of the kanban stage
      required: true
      schema:
        type: string
  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized
