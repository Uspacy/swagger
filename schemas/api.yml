      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LettersReadUnreadDto"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
