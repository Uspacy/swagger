        - bearerAuth: []
  # emailService end

  # history begin
  /history/v1/{service}/{entity_table_name}/{id}:
    get:
      summary: Get history for a specific service and entity
      description: Returns the history of changes for the given service and entity.
      parameters:
        - name: service
          in: path
          required: true
          description: The name of the service
          schema:
            type: string
        - name: entity_table_name
          in: path
          required: true
          description: The name of the entity table
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: The ID of the entity
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: The page number for pagination
          schema:
            type: integer
            default: 1
        - name: list
          in: query
          required: false
          description: Filter for listing items
          schema:
            type: string
            default: all
        - name: action
          in: query
          required: false
          description: The type of action performed
          schema:
            type: string
      responses:
        "200":
          description: Successfully retrieved history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        changed_by:
                          type: string
                          example: "3"
                        changed_at:
                          type: string
                          example: "1723721790"
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              field_id:
                                type: string
                                example: "comment"
                              action:
                                type: string
                                example: "create"
                              from:
                                type: object
                                properties:
                                  value:
                                    type: string
                                    example: ""
                                  display_value:
                                    type: string
                                    example: ""
                              to:
                                type: object
                                properties:
                                  value:
                                    type: string
                                    example: "1724778698"
                                  display_value:
                                    type: string
                                    example: "New Value"
              example:
                data:
                  - changed_by: "3"
                    changed_at: "1723721790"
                    items:
                      - field_id: "comment"
                        action: "create"
                        from:
                          value: ""
                          display_value: ""
                        to:
                          value: ""
                          display_value: "Get feedback"
                      - field_id: "parentId"
                        action: "update"
                        from:
                          value: ""
                          display_value: ""
                        to:
                          value: "25"
                          display_value: "Test notification 2"
                      - field_id: "status"
                        action: "update"
                        from:
                          value: "inWork"
                          display_value: ""
                        to:
                          value: "onControl"
                          display_value: ""
                      - field_id: "deadline"
                        action: "update"
                        from:
                          value: "1724519498"
                          display_value: ""
                        to:
                          value: "1724778698"
                          display_value: ""
                  - changed_by: "13"
                    changed_at: "1723721800"
                    items:
                      - field_id: "comment"
                        action: "create"
                        from:
                          value: ""
                          display_value: ""
                        to:
                          value: ""
                          display_value: "New comment"
                  - changed_by: "22"
                    changed_at: "1723721790"
                    items:
                      - field_id: "parentId"
                        action: "update"
                        from:
                          value: ""
                          display_value: ""
                        to:
                          value: "25"
                          display_value: "Test notification 2"
                  - changed_by: "45"
                    changed_at: "1723721790"
                    items:
                      - field_id: "status"
                        action: "update"
                        from:
                          value: "inWork"
                          display_value: ""
                        to:
                          value: "onControl"
                          display_value: ""
                  - changed_by: "10"
                    changed_at: "1723721790"
                    items:
                      - field_id: "deadline"
                        action: "update"
                        from:
                          value: "1724519498"
                          display_value: ""
                        to:
                          value: "1724778698"
                          display_value: ""
        "422":
          description: Invalid input parameters
        "404":
          description: Entity not found
      tags:
        - history
      security:
        - bearerAuth: []
  # history end

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  text:
                    type: array
                    items:
                      example: "Forbidden message"
              status:
                type: boolean
                example: true
    NoContent:
      description: No Content
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    JoinRequestNotFound:
      description: Join request not found
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  text:
                    type: array
                    items:
                      type: string
                    default:
                      - join request not found
              status:
                type: boolean
                default: false

    # search serivce
    SearchErrorMessage:
      description: Custom error
    ValidationError:
      description: Validation error response
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name: ["The field_name field is required."]
              status:
                type: boolean
                example: true
  parameters:
    userId:
      name: userId
      in: path
      description: User id
      required: true
      schema:
        type: integer
    departmentId:
      name: departmentId
      in: path
      description: Department id
      required: true
      schema:
        type: string
    roleId:
      name: roleId
      in: path
      description: Role id
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: current page
      required: false
      schema:
        type: integer
        default: 1
      example: 1
    searchEmail:
      name: email
      in: query
      required: false
      schema:
        type: string
      example: rar.stas@gmail.com
    searchFirstName:
      name: firstName
      in: query
      required: false
      schema:
        type: string
      example: Stas
    searchLastName:
      name: LastName
      in: query
      required: false
      schema:
        type: string
      example: Raranetskyi
    searchPortalDomain:
      name: domain
      in: query
      required: false
      schema:
        type: string
      example: alter_ego
    list:
      name: list
      in: query
      description: how many items should be per page
      required: false
      schema:
        type: number
        default: 20
      example: 10
    query:
      name: query
      in: query
      description: search query
      required: false
      schema:
        type: string
        default: ""
      example: "some query string"
    filter:
      name: filter
      in: query
      description: Fields, corresponding to the available list of entity.
      required: false
      style: deepObject
      schema:
        type: object
    postId:
      name: postId
      in: path
      description: Post id
      required: true
      schema:
        type: string
    commentId:
      name: commentId
      in: path
      description: Comment id
      required: true
      schema:
        type: string
    taskId:
      name: taskId
      in: path
      description: Task id
      required: true
      schema:
        type: string
    stageId:
      name: stageId
      in: path
      description: Stage id
      required: true
      schema:
        type: string
    order_by:
      name: order_by
      in: query
      description: sorting direction
      required: false
      schema:
        type: string
        default: desc
      example: order_by=asc
    field_name:
      name: field_name
      in: query
      description: the field we are looking for
      required: false
      schema:
        type: string
      example: priority=Low
    sort_by:
      name: sort_by
      in: query
      description: the field by which to sort
      required: false
      schema:
        type: string
      example: sort_by=deadline
    checkListId:
      name: checkListId
      in: path
      description: checklist id
      required: true
      schema:
        type: string
    checkListItemId:
      name: checkListItemId
      in: path
      description: checklist item id
      required: true
      schema:
        type: string
    entityType:
      in: query
      name: entityType
      schema:
        $ref: "#/components/schemas/EntityTypes"
      description: Entity type name
    entityId:
      in: query
      name: entityId
      schema:
        type: integer
        format: int64
      required: true
      description: Entity ID
    entity_id:
      in: path
      name: entity_id
      schema:
        type: integer
        format: int64
      required: true
      description: Entity ID
    entityIds:
      in: query
      name: entityIds
      description: >
        Use this parameter instead of `entityId` to list files for multiple entities at once. The response differs in this case.
      schema:
        type: array
        items:
          type: integer
          format: int64
      required: true
    groupId:
      name: groupId
      in: path
      description: Group id
      required: true
      schema:
        type: integer
    app_id:
      name: app_id
      in: path
      description: App id
      required: true
      schema:
        type: string
    archived:
      name: archived
      in: query
      description: filter archived or non-archived group
      required: false
      schema:
        type: boolean
        default: false
      example: true, false, 1, 0, yes, no, ""
    entity:
      name: entity
      in: path
      description: entity code
      required: true
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      description: Item id
      required: true
      schema:
        type: string
    field:
      name: field
      in: path
      description: field code
      required: true
      schema:
        type: string
    value:
      name: value
      in: path
      description: list value code
      required: true
      schema:
        type: string
    funnelId:
      name: funnelId
      in: path
      description: funnel id
      required: true
      schema:
        type: string
    reasonId:
      name: reasonId
      in: path
      description: reason id
      required: true
      schema:
        type: string
    call_event_id:
      name: call_event_id
      in: path
      description: call event id
      required: true
      schema:
        type: string
    entity_code:
      name: entity_code
      in: path
      description: entity code
      required: true
      schema:
        type: string
    filter_number_enum:
      name: filterNumberEnum
      in: query
      description: Array of numeric values
      schema:
        type: array
        items:
          type: integer
          format: int64
    filter_string_enum:
      name: filterStringEnum
      in: query
      description: Array of string values
      schema:
        type: array
        items:
          type: string
    filter_array_of_time_ranges:
      name: filterArrayOfTimeRanges
      in: query
      description: Array of strings formatted in the following way - <start_time>,<end_time>
      schema:
        type: array
        items:
          type: string
      example: ["1674432000,1679529600"]
    filterFunnel:
      name: funnel_id
      in: query
      description: funnel id
      required: false
      schema:
        type: string
    webhookId:
      name: webhookId
      in: path
      description: Outgoing Webhook id
      required: true
      schema:
        type: integer
    incomingWebhookId:
      name: incomingWebhookId
      in: path
      description: Incoming Webhook id
      required: true
      schema:
        type: integer
    active:
      name: active
      in: query
      description: Active
      required: false
      schema:
        type: boolean
    createdAt:
      name: created_at[][]
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 0
    filterUserId:
      name: userId
      in: query
      description: User id
      required: false
      schema:
        type: integer
    permissions:
      name: permissions[]
      in: query
      description: Filter results by specified permissions. Multiple values can be provided.
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            [
              crm,
              activities,
              tasks,
              comments,
              company,
              newsfeed,
              messenger,
              groups,
              files,
              email,
            ]
      example:
        - tasks
        - crm
    name:
      name: name
      in: query
      description: Name
      required: false
      schema:
        type: string
    emailId:
      name: emailId
      in: path
      description: The ID of the email
      required: true
      schema:
        type: integer
        example: 10
    emailLetterId:
      name: letterId
      in: path
      description: The ID of the leter
      required: true
      schema:
        type: integer
        example: 22

    emailFolderId:
      name: folderId
      in: path
      description: The ID of the email folder
      required: true
      schema:
        type: integer
        example: 61
    emailSignatureId:
      name: signatureId
      in: path
      description: The ID of the email signature
      required: true
      schema:
        type: integer
        example: 2

  schemas:
    # common begin
    Meta:
      type: object
      properties:
        currentPage:
          type: number
          example: 1
        from:
          type: number
          example: 1
        lastPage:
          type: number
          example: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                example: null
              label:
                type: string
                example: "Previous"
              active:
                type: boolean
                example: false
        path:
          type: string
          example: "https://domain.uspacy.ua/groups/v1/groups"
        perPage:
          type: number
          example: 20
        to:
          type: number
          example: 2
        total:
          type: number
          example: 2
    Roles:
      type: array
      items:
        type: string
      example:
        - OWNER
        - Employee
        - ADMIN
    Email:
      type: string
      example: "rar.stas@gmail.com"
    multipleEmail:
      type: array
      items:
        properties:
          id:
            type: string
            example: "01gdnpddf5xgzxqvcn4x83mc2s"
          type:
            type: string
            example: main
          value:
            type: string
            example: "stark@gmail.com"
          main:
            type: boolean
            example: true
      example:
        - id: ""
          type: main
          value: stark@gmail.com
          main: true
        - id: "01gdnpddf5xgzxqvcn4x83mc2s"
          type: work
          value: benner@gmail.com
          main: false
    Phone:
      type: array
      items:
        properties:
          id:
            type: string
            example: "01gdnpddf5xgzxqvcn4x83mc2s"
          type:
            type: string
            enum: [WORK, MOBILE, HOME]
            example: WORK
          value:
            type: string
            example: "+380123456789"

    Date:
      type: number
      description: timestamp in seconds
      default: 0
      example: 1654180120
    Files:
      type: array
      items:
        type: string
      example:
        - path/to/image.jpg
        - path/to/image.png
    # common end

    # users begin
    User:
      type: object
