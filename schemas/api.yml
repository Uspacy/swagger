    post:
      summary: Add Letter to Send Queue
      description: Adds a letter to the specified folder's send queue. The `emailFolderId` parameter must reference a folder with the `is_pending` flag set to `true`. In the request body, the `destination_folder_id` must reference a folder with the `is_sent` flag set to `true`.
