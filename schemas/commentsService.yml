# commentsService OpenAPI paths and definitions
# This file was separated from api.yml for modularity.

openapi: 3.0.0
components:
  schemas:
    errorMessage:
      type: object
      properties:
        message:
          type: string
    Data:
      type: object
      properties:
        encoding:
          type: string
        delimiter:
          type: string
        entityType:
          type: integer
        columns:
          type: object
          additionalProperties:
            type: string
        headers:
          type: object
          additionalProperties:
            type: string
    Date:
      type: number
      description: timestamp in seconds
      default: 0
      example: 1654180120
    Files:
      type: array
      items:
        type: string
      example:
        - path/to/image.jpg
        - path/to/image.png
    EntityTypes:
      oneOf:
        - type: string
          enum:
            - comment
            - post
            - task
        - type: string
          pattern: '^[a-zA-Z0-9_\-]+$'
      description: |
        Entity type name. You can use one of the predefined values (comment, post, task) or provide any custom string value matching the pattern.
    CommentServiceDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        entityType:
          allOf:
            - $ref: "#/components/schemas/EntityTypes"
            - example: "post"
        entityId:
          type: integer
          format: int64
          example: 1
        message:
          type: string
          example: Message comment
        authorId:
          type: string
          example: 1
        date:
          $ref: "#/components/schemas/Date"
        mentioned:
          $ref: "#/components/schemas/MentionedDto"
        notify:
          $ref: "#/components/schemas/NotifyDto"
    CommentExtrasServiceDto:
      type: object
      properties:
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionServiceDto"
        nextId:
          type: integer
          format: int64
          example: 3
          description: If NULL, this is the last comment if the (sub)thread
        prevId:
          type: integer
          format: int64
          example: 1
          description: If NULL, this is the first comment if the (sub)thread
    ReactionServiceDto:
      type: object
      properties:
        reaction:
          type: integer
          format: int64
          example: 128513
          description: Represents the UNICODE symbol such as 0x0001F601
        amount:
          type: integer
          format: int32
          example: 53
        entityId:
          type: integer
          format: int64
          example: 1
    CreateCommentServiceDto:
      type: object
      properties:
        entityType:
          allOf:
            - $ref: "#/components/schemas/EntityTypes"
            - example: "post"
        entityId:
          type: integer
          format: int64
          example: 1
        message:
          type: string
          example: Message post
        authorId:
          type: integer
          example: 1
        date:
          type: integer
          example: 1627862400
        upload_id:
          type: string
          example: null
        file_ids:
          type: array
          items:
            type: integer
          example: []
        mentioned:
          $ref: "#/components/schemas/MentionedDto"
        notify:
          $ref: "#/components/schemas/NotifyDto"
        rootParent:
          $ref: "#/components/schemas/RootParentDto"
        root_parent:
          $ref: "#/components/schemas/RootParentDto"
      required:
        - entityType
        - entityId
        - message
    RootParentDto:
      type: object
      description: "Optional parameter for notification of comment creation. Can be sent as 'rootParent' (camelCase) or 'root_parent' (snake_case)."
      properties:
        type:
          type: string
          description: "Type of parent entity"
          example: "post"
        data:
          type: object
          properties:
            id:
              oneOf:
                - type: string
                - type: integer
              description: "Parent entity id (can be string or integer)"
              example: 732
            title:
              type: string
              example: "Entity title"
              description: "Parent entity title"
        service:
          type: string
          description: "Service name (e.g., 'news_feed', 'crm')"
          example: "news_feed"
        table_name:
          type: string
          description: "Table name for CRM entities (e.g., 'leads', 'deals')"
          example: "leads"
      required:
        - type
        - data
        - service
    UpdateCommentServiceDto:
      type: object
      properties:
        message:
          type: string
          example: Message post
    MentionedDto:
      type: object
      properties:
        users:
          type: array
          items:
            type: integer
          example: [32, 85]
        groups:
          type: array
          items:
            type: integer
          example: [43, 12, 2]
        departments:
          type: array
          items:
            type: integer
          example: []
    NotifyDto:
      type: object
      properties:
        users:
          type: array
          items:
            type: integer
          example: [32, 85]
        groups:
          type: array
          items:
            type: integer
          example: [43, 12, 2]
        departments:
          type: array
          items:
            type: integer
          example: []
  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorMessage"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/errorMessage"

  parameters:
    entityIds:
      in: query
      name: entityIds
      description: >
        Use this parameter instead of `entityId` to list files for multiple entities at once. The response differs in this case.
      schema:
        type: array
        items:
          type: integer
          format: int64
      required: true
    entityType:
      in: query
      name: entityType
      schema:
        type: string
        description: |
          Entity type name. You can use one of the predefined values or provide any custom string value.
        example: customType
        x-enum-varnames:
          - post
          - comment
          - task
        pattern: '^[a-zA-Z0-9_\-]+$'
      description: Entity type name
    entityId:
      in: query
      name: entityId
      schema:
        type: integer
        format: int64
      required: true
      description: Entity ID
    childList:
      name: childList
      in: query
      description: >
        Use this to define the number of child comments to retrieve.
        Retrieve all if missing or retrieve the rest if `lastId` is present.
      required: false
      schema:
        type: integer
        format: int32
        default: 2
      example: 2
    nextId:
      name: nextId
      in: query
      description: >
        The top level comments are being paginated starting from the last page but in the ascending order.
        This parameter used to point the topmost comment on the previous page. For example: to get the
        previous page in the sample below `nextId` must be 22.

        * comment-22

        * comment-23

        * comment-24


        and the entire query should look like the following:


        ```
        ?entityType=post&entityId=123&list=3&childList=2&nextId=22
        ```


        This means: to get the previous 3 comments of the entity `post-123` along with the possible
        child comments (no more then 2 child comments per parent) relating to the `comment-22`
      required: false
      schema:
        type: integer
        format: int64
    lastId:
      name: lastId
      in: query
      description: >
        This parameter used to point the bottom child comment on the previous page. For example: to get the
        next page if the child comments in the sample below, `lastId` must be 27, `entityType` must be "comment"
        and `entityId` must be 25.

          * comment-23

          * comment-24

          * comment-25

          * child-comment-26-of-parent-25

          * child-comment-27-of-parent-25


          and the entire query should look like the following:



          ```
          ?entityType=post&entityId=123&childList=2&entityType=comment&entityId=25&lastId=27
          ```


          This means: to get the next 2 child comments of parent `comment-25` of the entity `post-123` relating to the `child-comment-27`
      required: false
      schema:
        type: integer
        format: int64
    list:
      name: list
      in: query
      description: how many items should be per page
      required: false
      schema:
        type: number
        default: 20
      example: 10
info:
  title: Comments service
  description: "API for managing comments on various entities such as posts, tasks, and other content types. Supports threaded comments, mentions, reactions, and notifications."
  version: 1.0.0
tags:
  - name: comments
    description: Operations for managing comments on entities
servers:
  - url: https://{domain}.uspacy.ua
    description: Ukrainian server
  - url: https://{domain}.uspacy.eu
    description: EU server
  - url: https://{domain}.uspacy.com.br
    description: Brazilian server
  - url: https://{domain}.uspacy.com
    description: International server
paths:
  # comments begin

  /comments/v1/comments:
    get:
      operationId: CommentsController_getComments
      summary: Get comments list
      description: >
        Retrieves a paginated list of comments related to a specific entity (post, task, or custom entity type).
        Supports nested/threaded comments where child comments can be retrieved separately.
        The `nextId` and `prevId` fields in the response help with pagination - comments are paginated
        starting from the last page in ascending order.
      parameters:
        - name: entity_type
          in: query
          description: >
            Entity type name (e.g., 'post', 'task', or custom type).
            If set to 'comment', the request retrieves child comments where `entityId` represents the parent comment ID.
            Use along with `childList` and `lastId` to paginate child comments.
          schema:
            $ref: "#/components/parameters/entityType/schema"
          example: post
        - $ref: "#/components/parameters/entityId"
        - name: list
          in: query
          description: >
            Number of top-level comments to retrieve per page.
            If omitted, retrieves all comments. Use with `nextId` for pagination.
          schema:
            $ref: "#/components/parameters/list/schema"
          example: 3
        - $ref: "#/components/parameters/childList"
        - $ref: "#/components/parameters/nextId"
        - $ref: "#/components/parameters/lastId"
      responses:
        "200":
          description: List of comments with pagination info and reactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/CommentServiceDto"
                        - $ref: "#/components/schemas/CommentExtrasServiceDto"
              example:
                data:
                  - id: 45
                    entityType: post
                    entityId: 123
                    message: "This is a great post!"
                    authorId: "7"
                    date: 1654180120
                    reactions:
                      - reaction: 128077
                        amount: 5
                        entityId: 45
                    nextId: 46
                    prevId: 44
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      tags:
        - comments
      security:
        - bearerAuth: []
    post:
      operationId: CommentsController_createComment
      summary: Create a comment
      description: >
        Creates a new comment on an entity. Supports mentions of users, groups, and departments,
        as well as file attachments. Optionally, you can specify notification recipients and
        provide parent entity information for enhanced notification context.
      requestBody:
        required: true
        description: Comment data including the target entity, message content, and optional mentions
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentServiceDto"
            example:
              entityType: post
              entityId: 123
              message: "Great work on this! @John please review."
              authorId: 7
              date: 1654180120
              mentioned:
                users: [32, 85]
                groups: []
                departments: []
              notify:
                users: [32]
                groups: []
                departments: []
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentServiceDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      tags:
        - comments
      security:
        - bearerAuth: []

  /comments/v1/comments?entityIds[]:
    get:
      operationId: CommentsController_getCommentsByEntityIds
      summary: Get comments for multiple entities
      description: >
        Retrieves comments for multiple entities at once. The response is grouped by entity ID,
        making it efficient for batch operations like loading comments for a list of posts.
        Supports the same pagination options as the single-entity endpoint.
      parameters:
        - name: entity_type
          in: query
          description: >
            Entity type name (e.g., 'post', 'task', or custom type).
            If set to 'comment', retrieves child comments where each entityId represents a parent comment ID.
          schema:
            $ref: "#/components/parameters/entityType/schema"
          example: post
        - $ref: "#/components/parameters/entityIds"
        - name: list
          in: query
          description: >
            Number of top-level comments to retrieve per entity.
            If omitted, retrieves all comments for each entity.
          schema:
            $ref: "#/components/parameters/list/schema"
          example: 3
        - $ref: "#/components/parameters/childList"
        - $ref: "#/components/parameters/nextId"
        - $ref: "#/components/parameters/lastId"
      responses:
        "200":
          description: Comments grouped by entity ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entityId:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/CommentServiceDto"
                            - $ref: "#/components/schemas/CommentExtrasServiceDto"
              example:
                data:
                  "123":
                    - id: 45
                      entityType: post
                      entityId: 123
                      message: "First comment on post 123"
                      authorId: "7"
                      date: 1654180120
                  "456":
                    - id: 67
                      entityType: post
                      entityId: 456
                      message: "Comment on post 456"
                      authorId: "12"
                      date: 1654180220
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      tags:
        - comments
      security:
        - bearerAuth: []

  /comments/v1/comments/{commentId}:
    patch:
      operationId: CommentsController_updateComment
      summary: Update a comment
      description: >
        Updates the message content of an existing comment. Only the comment author
        or users with appropriate permissions can update a comment.
      parameters:
        - in: path
          name: commentId
          schema:
            type: integer
            format: int64
          required: true
          description: The unique identifier of the comment to update
          example: 45
      requestBody:
        required: true
        description: Updated comment content
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentServiceDto"
            example:
              message: "Updated comment text with corrections."
      responses:
        "200":
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentServiceDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      tags:
        - comments
      security:
        - bearerAuth: []
    delete:
      operationId: CommentsController_deleteComment
      summary: Delete a comment
      description: >
        Permanently removes a comment by its ID. This also removes all child comments (replies)
        associated with this comment. Only the comment author or users with appropriate permissions can delete a comment.
      parameters:
        - in: path
          name: commentId
          schema:
            type: integer
            format: int64
          required: true
          description: The unique identifier of the comment to delete
          example: 45
      responses:
        "204":
          description: Comment deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      tags:
        - comments
      security:
        - bearerAuth: []

  /comments/v1/comments?entityType&entityId:
    delete:
      operationId: CommentsController_deleteCommentsByEntity
      summary: Delete all comments for an entity
      description: >
        Removes all comments associated with a specific entity. This is typically used
        for cleanup when the parent entity (e.g., a post or task) is deleted.
        This operation is often triggered internally to maintain data consistency.
      parameters:
        - $ref: "#/components/parameters/entityType"
        - $ref: "#/components/parameters/entityId"
      responses:
        "204":
          description: All comments for the entity deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      tags:
        - comments
      security:
        - bearerAuth: []
  # comments end
