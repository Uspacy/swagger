                  - type: object
                    properties:
                      meta:
                        $ref: "#/components/schemas/Meta"
              example:
                data:
                  - id: 1
                    name: Invoice template
                    is_active: true
                    code: invoice_tpl
                    disabled: false
                    file:
                      name: invoice.docx
                      size: "15360"
                      extension: docx
                      download_link: /files/templates/invoice.docx
                    binding_entities:
                      - entity_id: 123
                        funnels: [1, 2]
