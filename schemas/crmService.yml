    get:
      tags:
        - transfers
      summary: Get transfer progress
      description: Returns the progress of an ongoing CRM data transfer between users.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: in_progress
                from_user_id: 5
                to_user_id: 10
                total_items: 150
                transferred_items: 75
                progress_percent: 50
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/transfers/quantity:
    post:
      tags:
        - transfers
      summary: Get quantity of items to transfer
      description: Calculates how many CRM items would be transferred between users. Call this before initiating a transfer.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_user_id:
                  type: integer
                to_user_id:
                  type: integer
                entity_types:
                  type: array
                  items:
                    type: string
            example:
              from_user_id: 5
              to_user_id: 10
              entity_types:
                - leads
                - deals
                - contacts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                leads: 45
                deals: 30
                contacts: 75
                total: 150
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/transfers/user:
    post:
      tags:
        - transfers
      summary: Transfer CRM data to another user
      description: |
        Initiates a transfer of CRM data (leads, deals, contacts, etc.) from one user to another.
        Useful when an employee leaves or responsibilities are reassigned.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_user_id:
                  type: integer
                to_user_id:
                  type: integer
                entity_types:
                  type: array
                  items:
                    type: string
            example:
              from_user_id: 5
              to_user_id: 10
              entity_types:
                - leads
                - deals
                - contacts
                - companies
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/transfers/stop:
    get:
      tags:
        - transfers
      summary: Stop ongoing transfer
      description: Stops an in-progress CRM data transfer. Items already transferred will remain with the target user.
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    ValidationError:
      description: Validation error response
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
                example:
                  field_name: ["The field_name field is required."]
              status:
                type: boolean
                example: true
  parameters:
    entity:
      name: entity
      in: path
      description: Entity table name
      required: true
      schema:
        type: string
        enum:
          - leads
          - deals
          - contacts
          - companies
      example: leads
    entityItem:
      name: entityItem
      in: path
      description: Entity item identifier
      required: true
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      description: Item ID
      required: true
      schema:
        type: integer
        format: int64
    field:
      name: field
      in: path
      description: Field code
      required: true
      schema:
        type: string
    value:
      name: value
      in: path
      description: List item value
      required: true
      schema:
        type: string
    funnelId:
      name: funnelId
      in: path
      description: Funnel ID
      required: true
      schema:
        type: integer
    reasonId:
      name: reasonId
      in: path
      description: Reason ID
      required: true
      schema:
        type: integer
    stageId:
      name: stageId
      in: path
      description: Stage ID
      required: true
      schema:
        type: integer
    entity_id:
      name: entity_id
      in: path
      description: Entity item ID
      required: true
      schema:
        type: integer
    entity_code:
      name: entity_code
      in: path
      description: Related entity code
      required: true
      schema:
        type: string
    call_event_id:
      name: call_event_id
      in: path
      description: Call event ID
      required: true
      schema:
        type: integer
    filterFunnel:
      name: funnel_id
      in: query
      description: Filter by funnel ID
      required: false
      schema:
        type: integer
    page:
      name: page
      in: query
      description: Current page
      required: false
      schema:
        type: integer
        default: 1
      example: 1
    list:
      name: list
      in: query
      description: How many items should be per page
      required: false
      schema:
        type: integer
        default: 20
      example: 10
  schemas:
    Meta:
      type: object
      properties:
        currentPage:
          type: integer
          example: 1
        from:
          type: integer
          example: 1
        lastPage:
          type: integer
          example: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                example: null
              label:
                type: string
                example: "Previous"
              active:
                type: boolean
                example: false
        path:
          type: string
          example: "https://domain.uspacy.ua/crm/v1/entities/leads"
        perPage:
          type: integer
          example: 20
        to:
          type: integer
          example: 2
        total:
          type: integer
          example: 2
    multipleEmail:
      type: array
      items:
        properties:
          id:
            type: string
            example: "01gdnpddf5xgzxqvcn4x83mc2s"
          type:
            type: string
            example: main
          value:
            type: string
            example: "stark@gmail.com"
          main:
            type: boolean
            example: true
      example:
        - id: ""
          type: main
          value: stark@gmail.com
          main: true
        - id: "01gdnpddf5xgzxqvcn4x83mc2s"
          type: work
          value: benner@gmail.com
          main: false
    Phone:
      type: array
      items:
        properties:
          id:
            type: string
            example: "01gdnpddf5xgzxqvcn4x83mc2s"
          type:
            type: string
            enum: [WORK, MOBILE, HOME]
            example: WORK
          value:
            type: string
            example: "+380123456789"
          code:
            type: string
            example: "+380"
    SocialMedia:
      type: array
      items:
        properties:
          id:
            type: string
            example: "01gdnpddf5xgzxqvcn4x83bn2s"
          type:
            type: string
            example: facebook
          link:
            type: string
            example: https://www.facebook.com
    Files:
      type: array
      items:
        type: string
      example:
        - path/to/image.jpg
        - path/to/image.png
    Entity:
      type: object
      properties:
        title:
          type: string
          example: Leads
        tableName:
          type: string
          example: leads
        type:
          type: string
          example: leads
        sort:
          type: integer
          example: 1
