            application/json:
              schema:
                $ref: "#/components/schemas/EventCallList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - call events
      summary: Create call event
      description: |
        Creates a new call event. Used by telephony integrations to log calls in CRM.
        If `task_id` is not provided, a task for missed incoming calls is created automatically.
        If dynamic binding fields (deal_id, lead_id, etc.) are provided, automatic binding is skipped.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallEventDto"
            examples:
              incoming_missed_call:
                summary: Log a missed incoming call
                value:
                  integration_code: your_integration_code
                  external_id: 12345
                  call_type: incoming
                  ended_call_status: missed
                  from: "380667654321"
                  to: "380441234567"
                  begin_time: 1681893335
                  end_time: 1681893340
                  duration: 5
                  subject: Missed call
                  employees: [1, 2]
                  summary: Missed call from customer
                  transcription: "Hello, this is a customer calling about the order. Please contact me back at your earliest convenience."
                  crm_settings:
                    - setting_name: incoming_unknown
                      setting_value: do_nothing
                    - setting_name: incoming_unknown_responsible
                      setting_value: current_operator
                    - setting_name: incoming_unknown_source
                      setting_value: null
                    - setting_name: missed_known
                      setting_value: create_task
                    - setting_name: missed_known_responsible
                      setting_value: base_entity_responsible
                    - setting_name: missed_known_source
                      setting_value: null
                    - setting_name: missed_responsible
                      setting_value: 1
                    - setting_name: missed_unknown
                      setting_value: do_nothing
                    - setting_name: missed_unknown_responsible
                      setting_value: missed_responsible
                    - setting_name: missed_unknown_source
                      setting_value: null
                    - setting_name: outgoing_unknown
                      setting_value: do_nothing
                    - setting_name: outgoing_unknown_responsible
                      setting_value: current_operator
                    - setting_name: outgoing_unknown_source
                      setting_value: null
                    - setting_name: binding_version
                      setting_value: 1.0.0
              outgoing_successful_call:
                summary: Log a successful outgoing call
                value:
                  integration_code: your_integration_code
                  external_id: 12346
                  call_type: outgoing
                  ended_call_status: successed
                  from: "380441234567"
                  to: "380667654321"
                  begin_time: 1681893335
                  end_time: 1681893685
                  duration: 350
                  subject: Sales contract negotiation
                  deal_id: 1
                  entity_table: deals
                  note: Discussed delivery terms
                  call_record_link: "https://storage.example.com/recordings/12346.mp3"
                  summary: Discussed delivery terms
                  transcription: "Customer confirmed the delivery schedule and requested a quote for the additional service package."
                  crm_settings:
                    - setting_name: incoming_unknown
                      setting_value: do_nothing
                    - setting_name: incoming_unknown_responsible
                      setting_value: current_operator
                    - setting_name: incoming_unknown_source
                      setting_value: null
                    - setting_name: missed_known
                      setting_value: create_task
                    - setting_name: missed_known_responsible
                      setting_value: base_entity_responsible
                    - setting_name: missed_known_source
                      setting_value: null
                    - setting_name: missed_responsible
                      setting_value: 1
                    - setting_name: missed_unknown
                      setting_value: do_nothing
                    - setting_name: missed_unknown_responsible
                      setting_value: missed_responsible
                    - setting_name: missed_unknown_source
                      setting_value: null
                    - setting_name: outgoing_unknown
                      setting_value: do_nothing
                    - setting_name: outgoing_unknown_responsible
                      setting_value: current_operator
                    - setting_name: outgoing_unknown_source
                      setting_value: null
                    - setting_name: binding_version
                      setting_value: 1.0.0
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
