        task_id:
          type: integer
          example: null
          description: If task_id is provided the task's creation for missed incoming call is passing away
        contact_id:
          type: integer
          example: null
          description: If one of dynamic binding fields (deal_id, lead_id, contact_id, company_id) is provided the automatic binding with existing crm entities is passing away
        company_id:
          type: integer
          example: null
          description: If one of dynamic binding fields (deal_id, lead_id, contact_id, company_id) is provided the automatic binding with existing crm entities is passing away
        lead_id:
