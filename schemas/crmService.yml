      - $ref: "#/components/parameters/entity"
    get:
      tags:
        - trash
      summary: Get removed/deleted items
      description: |
        Returns a paginated list of items in the recycle bin for a specific entity type.
        Example: `GET /crm/v1/entities/leads/trash?page=1&list=20`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/list"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/CrmEntity"
                  - type: object
                    properties:
                      meta:
                        $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    delete:
      tags:
        - trash
      summary: Permanently delete trashed items
      description: Permanently deletes items from the recycle bin. This action cannot be undone.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_ids:
                  type: array
                  items:
                    type: integer
            example:
              entity_ids: [12, 13]
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
