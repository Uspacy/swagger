openapi: "3.1.0"
info:
  title: CRM service
  version: v1
servers:
  - url: https://{domain}.uspacy.ua
    description: Ukrainian server
  - url: https://{domain}.uspacy.eu
    description: EU server
  - url: https://{domain}.uspacy.com.br
    description: Brazilian server
  - url: https://{domain}.uspacy.com
    description: International server
tags:
  - name: entities
    description: Entity configuration and management
  - name: fields
    description: Fields, field types, list values, and field dependencies
  - name: items
    description: CRM entity items (leads, deals, contacts, companies)
  - name: pipeline
    description: Funnels, kanban stages, and reasons
  - name: activities
    description: CRM activities and tasks
  - name: call events
    description: Call event tracking and telephony integration
  - name: letters
    description: CRM letter management
  - name: customer contacts
    description: Customer contact lookup and matching
  - name: products
    description: Product catalog, categories, pricing, and taxes
  - name: documents
    description: Document templates and generated documents
  - name: requisites
    description: Requisites, bank requisites, and templates
  - name: permissions
    description: CRM access permissions
  - name: trash
    description: Recycle bin for deleted CRM items
  - name: transfers
    description: User data transfers between CRM users
paths:
  /crm/v1/entity:
    get:
      tags:
        - entities
      summary: Get available entities list
      description: Returns a list of all available CRM entities (leads, deals, contacts, companies, and custom entities).
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
              example:
                - title: Leads
                  tableName: leads
                  type: leads
                  sort: 1
                - title: Deals
                  tableName: deals
                  type: deals
                  sort: 2
                - title: Contacts
                  tableName: contacts
                  type: contacts
                  sort: 3
                - title: Companies
                  tableName: companies
                  type: companies
                  sort: 4
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - entities
      summary: Create entity
      description: Creates a new custom CRM entity type.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
            example:
              title: Partners
              tableName: partners
              type: partners
              sort: 5
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
              example:
                title: Partners
                tableName: partners
                type: partners
                sort: 5
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entity/{entityItem}:
    parameters:
      - $ref: "#/components/parameters/entityItem"
    patch:
      tags:
        - entities
      summary: Update entity
      description: Updates an existing CRM entity configuration.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entity"
            example:
              title: Updated Partners
              sort: 6
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entity"
              example:
                title: Updated Partners
                tableName: partners
                type: partners
                sort: 6
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
    delete:
      tags:
        - entities
      summary: Delete entity
      description: Deletes a custom CRM entity type. Built-in entities (leads, deals, contacts, companies) cannot be deleted.
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/field_types:
    get:
      tags:
        - fields
      summary: Get available field types list
      description: Returns all available field types that can be used when creating custom fields for CRM entities.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field_Types_List"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/fields:
    parameters:
      - $ref: "#/components/parameters/entity"
    get:
      tags:
        - fields
      summary: Get available fields list
      description: Returns all fields configured for a specific CRM entity type.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Field"
              example:
                - name: Title
                  code: title
                  required: true
                  editable: true
                  show: true
                  hidden: false
                  multiple: false
                  fieldSectionId: 1
                  default_value: ""
                  tooltip: ""
                  type: string
                  sort: 10
                - name: Source
                  code: source
                  required: false
                  editable: true
                  show: true
                  hidden: false
                  multiple: false
                  fieldSectionId: 1
                  default_value: ""
                  tooltip: "Lead source channel"
                  type: list
                  sort: 20
                - name: Phone
                  code: phone
                  required: false
                  editable: true
                  show: true
                  hidden: false
                  multiple: true
                  fieldSectionId: 2
                  default_value: ""
                  tooltip: ""
                  type: phone
                  sort: 30
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - fields
      summary: Create field
      description: Creates a new custom field for a CRM entity.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Field"
            example:
              name: Priority
              code: priority
              required: false
              editable: true
              show: true
              hidden: false
              multiple: false
              fieldSectionId: 1
              default_value: ""
              tooltip: "Lead priority level"
              type: list
              sort: 100
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
              example:
                name: Priority
                code: priority
                required: false
                editable: true
                show: true
                hidden: false
                multiple: false
                fieldSectionId: 1
                default_value: ""
                tooltip: "Lead priority level"
                type: list
                sort: 100
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/fields/{field}:
    parameters:
      - $ref: "#/components/parameters/entity"
      - $ref: "#/components/parameters/field"
    get:
      tags:
        - fields
      summary: Get field by code
      description: Returns a single field definition by its code for a specific entity.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
              example:
                name: Source
                code: source
                required: false
                editable: true
                show: true
                hidden: false
                multiple: false
                fieldSectionId: 1
                default_value: ""
                tooltip: "Lead source channel"
                type: list
                sort: 20
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    patch:
      tags:
        - fields
      summary: Edit field by code
      description: Updates a field configuration. Only provided fields are updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Field"
            example:
              name: Lead Source
              required: true
              tooltip: "Updated tooltip for lead source"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
              example:
                name: Lead Source
                code: source
                required: true
                editable: true
                show: true
                hidden: false
                multiple: false
                fieldSectionId: 1
                default_value: ""
                tooltip: "Updated tooltip for lead source"
                type: list
                sort: 20
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
    delete:
      tags:
        - fields
      summary: Delete field by code
      description: Removes a custom field from the entity. System fields cannot be deleted.
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/lists/dependencies:
    parameters:
      - $ref: "#/components/parameters/entity"
    get:
      tags:
        - fields
      summary: List field dependencies
      description: Returns all field dependencies configured for the entity. Dependencies define relationships between list field values.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
                - id: 1
                  parent_field: source
                  parent_value: website
                  child_field: sub_source
                  child_values:
                    - landing_page
                    - contact_form
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - fields
      summary: Create field dependency
      description: Creates a dependency between two list fields, so that child field values are filtered based on the selected parent value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              parent_field: source
              parent_value: website
              child_field: sub_source
              child_values:
                - landing_page
                - contact_form
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/lists/dependencies/{dependency_id}:
    parameters:
      - $ref: "#/components/parameters/entity"
      - name: dependency_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags:
        - fields
      summary: Delete field dependency
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/lists/{field}:
    parameters:
      - $ref: "#/components/parameters/entity"
      - $ref: "#/components/parameters/field"
    get:
      tags:
        - fields
      summary: Get list elements
      description: Returns all values for a list-type field (e.g., source, status options).
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceList"
              example:
                - title: Shop
                  value: shop
                  color: "#6AD01F"
                  sort: 10
                  selected: true
                - title: Website
                  value: website
                  color: "#2196F3"
                  sort: 20
                  selected: false
                - title: Referral
                  value: referral
                  color: "#FF9800"
                  sort: 30
                  selected: false
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - fields
      summary: Create or edit list items
      description: Creates or updates list values for a field. Send the full list of items to replace existing values.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SourceList"
            example:
              - title: Shop
                value: shop
                color: "#6AD01F"
                sort: 10
                selected: true
              - title: Website
                value: website
                color: "#2196F3"
                sort: 20
                selected: false
              - title: Social Media
                value: social_media
                color: "#E91E63"
                sort: 30
                selected: false
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/lists/{field}/{value}:
    parameters:
      - $ref: "#/components/parameters/entity"
      - $ref: "#/components/parameters/field"
      - $ref: "#/components/parameters/value"
    delete:
      tags:
        - fields
      summary: Delete list item
      description: Removes a single value from a list-type field. Example path - `DELETE /crm/v1/entities/leads/lists/source/referral`.
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}:
    parameters:
      - $ref: "#/components/parameters/entity"
    get:
      tags:
        - items
      summary: Get CRM entity items list
      description: |
        Returns a paginated list of CRM entity items with metadata.
        Supports pagination via `page` and `list` query parameters.
        Example: `GET /crm/v1/entities/leads?page=1&list=20`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/list"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/CrmEntity"
                            - $ref: "#/components/schemas/CrmEAdditionalFields"
                  - type: object
                    properties:
                      meta:
                        $ref: "#/components/schemas/Meta"
              example:
                data:
                  - id: 12
                    title: Lead example
                    owner: 1
                    source: shop
                    email:
                      - id: ""
                        type: main
                        value: stark@gmail.com
                        main: true
                    phone:
                      - id: "01gdnpddf5xgzxqvcn4x83mc2s"
                        type: WORK
                        value: "+380123456789"
                        code: "+380"
                    messengers: []
                    created_by: 1
                    changed_by: 1
                    created_at: 1674950100
                    updated_at: 1674951000
                  - id: 13
                    title: Another lead
                    owner: 2
                    source: website
                    email: []
                    phone: []
                    messengers: []
                    created_by: 2
                    changed_by: 2
                    created_at: 1674960100
                    updated_at: 1674961000
                meta:
                  currentPage: 1
                  from: 1
                  lastPage: 1
                  perPage: 20
                  to: 2
                  total: 2
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    post:
      tags:
        - items
      summary: Create CRM entity item
      description: |
        Creates a new CRM entity item (lead, deal, contact, or company).
        Example: `POST /crm/v1/entities/leads`
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCrmEntity"
            example:
              title: New lead from website
              owner: 1
              source: website
              funnel_id: 5
              email:
                - id: ""
                  type: main
                  value: john.doe@example.com
                  main: true
              phone:
                - id: ""
                  type: MOBILE
                  value: "+380501234567"
                  code: "+380"
              messengers:
                - id: ""
                  type: telegram
                  link: "https://t.me/johndoe"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CrmEntityResponce"
                  - $ref: "#/components/schemas/CrmEAdditionalFields"
              example:
                id: 14
                title: New lead from website
                owner: 1
                created_by: 1
                changed_by: 1
                converted: false
                first_name: ""
                last_name: ""
                patronymic: ""
                company_name: ""
                position: ""
                utm_source: ""
                utm_medium: ""
                utm_campaign: ""
                utm_content: ""
                utm_term: ""
                source:
                  title: Website
                  value: website
                  color: "#2196F3"
                  sort: 20
                  selected: false
                email:
                  - id: "01gdnpddf5xgzxqvcn4x83mc2s"
                    type: main
                    value: john.doe@example.com
                    main: true
                phone:
                  - id: "01gdnpddf5xgzxqvcn4x83bn2s"
                    type: MOBILE
                    value: "+380501234567"
                    code: "+380"
                messengers:
                  - id: "01gdnpddf5xgzxqvcn4x83cn2s"
                    type: telegram
                    link: "https://t.me/johndoe"
                kanban_status: IN_WORK
                kanban_reason_id: null
                kanban_stage_id: 22
                created_at: 1674970100
                updated_at: 1674970100
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/{itemId}:
    parameters:
      - $ref: "#/components/parameters/entity"
      - $ref: "#/components/parameters/itemId"
    get:
      tags:
        - items
      summary: Get CRM entity item
      description: |
        Returns a single CRM entity item by ID.
        Example: `GET /crm/v1/entities/leads/14`
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CrmEntity"
                  - $ref: "#/components/schemas/CrmEAdditionalFields"
              example:
                id: 14
                title: New lead from website
                owner: 1
                source: website
                email:
                  - id: "01gdnpddf5xgzxqvcn4x83mc2s"
                    type: main
                    value: john.doe@example.com
                    main: true
                phone:
                  - id: "01gdnpddf5xgzxqvcn4x83bn2s"
                    type: MOBILE
                    value: "+380501234567"
                    code: "+380"
                messengers: []
                created_by: 1
                changed_by: 1
                created_at: 1674970100
                updated_at: 1674970100
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
    patch:
      tags:
        - items
      summary: Edit CRM entity item
      description: |
        Updates an existing CRM entity item. Only provided fields are updated.
        Example: `PATCH /crm/v1/entities/leads/14`
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmEntity"
            example:
              title: Updated lead title
              source: referral
              phone:
                - id: "01gdnpddf5xgzxqvcn4x83bn2s"
                  type: WORK
                  value: "+380441234567"
                  code: "+380"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CrmEntity"
                  - $ref: "#/components/schemas/CrmEAdditionalFields"
              example:
                id: 14
                title: Updated lead title
                owner: 1
                source: referral
                email:
                  - id: "01gdnpddf5xgzxqvcn4x83mc2s"
                    type: main
                    value: john.doe@example.com
                    main: true
                phone:
                  - id: "01gdnpddf5xgzxqvcn4x83bn2s"
                    type: WORK
                    value: "+380441234567"
                    code: "+380"
                messengers: []
                created_by: 1
                changed_by: 1
                created_at: 1674970100
                updated_at: 1674980100
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
    delete:
      tags:
        - items
      summary: Delete CRM entity item
      description: |
        Moves a CRM entity item to trash. Use the trash endpoints to permanently delete or restore.
        Example: `DELETE /crm/v1/entities/leads/14`
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/mass_edit:
    parameters:
      - $ref: "#/components/parameters/entity"
    patch:
      tags:
        - items
      summary: Mass edit CRM entity items
      description: |
        Updates multiple CRM entity items at once. Provide an array of entity IDs and the fields to update.
        Example: `PATCH /crm/v1/entities/leads/mass_edit`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of entities to update
                data:
                  type: object
                  description: Fields to update on all selected entities
            example:
              entity_ids: [12, 13, 14]
              data:
                owner: 3
                source: website
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/mass_deletion:
    parameters:
      - $ref: "#/components/parameters/entity"
    delete:
      tags:
        - items
      summary: Mass delete CRM entity items
      description: |
        Moves multiple CRM entity items to trash at once.
        Example: `DELETE /crm/v1/entities/leads/mass_deletion`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entity_ids:
                  type: array
                  items:
                    type: integer
            example:
              entity_ids: [12, 13, 14]
      responses:
        "204":
          description: No content
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/merge:
    parameters:
      - $ref: "#/components/parameters/entity"
    post:
      tags:
        - items
      summary: Merge CRM entities
      description: |
        Merges two or more CRM entity items into one. The primary entity retains its ID and is enriched with data from secondary entities, which are then deleted.
        Example: `POST /crm/v1/entities/contacts/merge`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primary_id:
                  type: integer
                  description: ID of the entity to keep
                secondary_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of entities to merge into primary
            example:
              primary_id: 12
              secondary_ids: [13, 14]
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/{itemId}/upload_avatar:
    parameters:
      - $ref: "#/components/parameters/entity"
      - $ref: "#/components/parameters/itemId"
    post:
      tags:
        - items
      summary: Upload entity avatar
      description: |
        Uploads an avatar image for a CRM entity item (contact or company).
        Send the image as `multipart/form-data` with the field name `avatar`.
        Example: `POST /crm/v1/entities/contacts/14/upload_avatar`
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG). Max size 5MB.
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
      security:
        - bearerAuth: []
  /crm/v1/entities/{entity}/tabs:
    parameters:
      - $ref: "#/components/parameters/entity"
    get:
      tags:
        - items
      summary: Get entity tabs
      description: |
        Returns the tab configuration for the entity card view.
        Example: `GET /crm/v1/entities/leads/tabs`
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              example:
                - code: main
                  title: Main
                  sort: 1
                - code: activities
                  title: Activities
                  sort: 2
