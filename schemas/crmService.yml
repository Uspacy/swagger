        entity_table:
          type: string
          description: The base entity the call event connected to could be provided or could be omitted in a case if just have usual call. In this the "empty" value will be automatically filled and the call event will be shown just in call logs history
          enum:
            - empty
            - leads,
            - deals
            - contacts
            - companies
        employees:
          type: array
          description: Employees that have been dialed during the call. Could be omitted if don't have such information
          example: [1, 2, 3]
        contacts:
          type: array
          description: The contacts that have connection with particulat call event. Could be omitted if don't have such information
          example: [1, 2, 3]
        companies:
          type: array
          description: The companies that have connection with particulat call event. Could be omitted if don't have such information
          example: [1, 2, 3]
        subject:
          type: string
          example: First call
          description: Could be omitted. In such case the default value will be "Call"
        call_type:
          type: string
          enum:
            - outgoing
            - incoming
        ended_call_status:
          type: string
          enum:
            - null
            - successed
            - missed
            - declined
            - subscriber_unavailable
            - number_not_exist
            - call_failure
        from:
          type: string
          example: 380632232232
        to:
          type: string
          example: null
          description: Could be null cause on new event call from telephony we don't have "to" value for sure
        begin_time:
          type: integer
          example: 1681893335
        end_time:
          type: integer
          example: 1681893685
        duration:
          type: integer
          example: 350
        call_record_link:
          type: string
          example: null
          description: It could be call link that telephony provides or link issued by import flow (via files-backend)
        note:
          type: string
          example: Fixed agenda
        summary:
          type: string
          example: Follow-up call summary
          description: Optional short summary of the call content
        transcription:
          type: string
          example: "Hello, this is a customer calling about the order. Please contact me back at your earliest convenience."
          description: Optional transcription of the call content from audio or video
        crm_settings:
          type: array
          description: Optional CRM settings used to create or bind CRM entities for different call scenarios
          items:
            $ref: "#/components/schemas/CallEventCrmSetting"
      required:
        - integration_code
        - call_type
        - from
    CallEventContacts:
      properties:
        id:
          example: 1
          type: integer
        title:
          example: George Everest
          type: string
      type: object
    CallEventCrmSetting:
      type: object
      description: |
        Optional scenario-specific CRM setting for call events.
        This payload is sent to CRM so it can create or bind CRM entities for different call scenarios.

        - `incoming_unknown`: `create_lead`, `create_contact`, `do_nothing`
        - `incoming_unknown_responsible`: `base_entity_responsible`, `missed_responsible`, `current_operator`
        - `incoming_unknown_source`: source name or `null`

        - `missed_known`: `create_task`, `create_lead`, `create_deal`, `create_task_and_lead`, `create_task_and_deal`, `do_nothing`
        - `missed_known_responsible`: `base_entity_responsible`, `missed_responsible`, `current_operator`
        - `missed_known_source`: source name or `null`
        - `missed_responsible`: default responsible user ID

        - `missed_unknown`: `create_lead`, `create_contact`, `create_task_and_lead`, `create_task_and_contact`, `do_nothing`
        - `missed_unknown_responsible`: `base_entity_responsible`, `missed_responsible`, `current_operator`
        - `missed_unknown_source`: source name or `null`

        - `outgoing_unknown`: `create_lead`, `create_contact`, `do_nothing`
        - `outgoing_unknown_responsible`: `base_entity_responsible`, `missed_responsible`, `current_operator`
        - `outgoing_unknown_source`: source name or `null`

        - `binding_version`: always `1.0.0`
      properties:
        setting_name:
          type: string
          enum:
            - incoming_unknown
            - incoming_unknown_responsible
            - incoming_unknown_source
            - missed_known
            - missed_known_responsible
            - missed_known_source
            - missed_responsible
            - missed_unknown
            - missed_unknown_responsible
            - missed_unknown_source
            - outgoing_unknown
            - outgoing_unknown_responsible
            - outgoing_unknown_source
            - binding_version
          example: incoming_unknown
        setting_value:
          oneOf:
            - type: string
            - type: integer
            - type: null
          example: do_nothing
          description: Value depends on setting_name; allowed values include do_nothing, create_lead, create_contact, create_task, create_deal, create_task_and_lead, create_task_and_contact, create_task_and_deal, base_entity_responsible, missed_responsible, current_operator, null, and 1.0.0 for binding_version.
