openapi: 3.0.0
paths:
  /messenger/v1/chats:
    get:
      operationId: ChatsController_handleGetChats
      summary: Get all chats
      description: Retrieves a list of all chats available to the authenticated user. Optionally filter by chat type.
      parameters:
        - name: type
          required: false
          in: query
          description: Filter chats by type (e.g., PRIVATE, PUBLIC, GROUP, DIRECT, EXTERNAL)
          schema:
            type: string
          example: GROUP
      responses:
        '200':
          description: The chats list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
    post:
      operationId: ChatsController_handleCreateChat
      summary: Create a new chat
      description: Creates a new chat with the specified members, type, and settings. Supports private, public, group, direct, and external chat types.
      parameters: []
      requestBody:
        required: true
        description: Chat creation details including members, type, and optional settings
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatDto'
            example:
              members: [1, 2, 3]
              type: GROUP
              name: "Project Discussion"
              ownerId: 1
      responses:
        '200':
          description: Created chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
    patch:
      operationId: ChatsController_handleUpdateChat
      summary: Update a chat
      description: Updates an existing chat's properties such as name, picture, members, or settings.
      parameters: []
      requestBody:
        required: true
        description: Chat update details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatDto'
            example:
              id: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
              name: "Updated Chat Name"
              pictureUrl: "https://example.com/new-picture.jpg"
      responses:
        '200':
          description: Updated chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/findByMeta:
    get:
      operationId: ChatsController_handleFindByMeta
      summary: Find chat by meta value
      description: Searches for a single chat by its metadata type and value. Useful for finding chats linked to external platforms or identifiers.
      parameters:
        - name: type
          required: true
          in: query
          description: The type of metadata to search by
          schema:
            enum:
              - phone
              - widgetUser
              - username
              - facebook
              - instagram
              - telegram
              - twitter
              - viber
              - whatsapp
            type: string
          example: telegram
        - name: value
          required: true
          in: query
          description: The metadata value to search for
          schema:
            type: string
          example: "@username"
      responses:
        '200':
          description: Find chat by meta value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/findAllByMeta:
    get:
      operationId: ChatsController_handleFindAllByMeta
      summary: Find all chats by meta value
      description: Searches for all chats matching the specified metadata type and value. Returns multiple results if found.
      parameters:
        - name: type
          required: true
          in: query
          description: The type of metadata to search by
          schema:
            enum:
              - phone
              - widgetUser
              - username
              - facebook
              - instagram
              - telegram
              - twitter
              - viber
              - whatsapp
            type: string
          example: phone
        - name: value
          required: true
          in: query
          description: The metadata value to search for
          schema:
            type: string
          example: "+1234567890"
      responses:
        '200':
          description: Find chats by meta value
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}:
    get:
      operationId: ChatsController_handleGetChat
      summary: Get chat by ID
      description: Retrieves detailed information about a specific chat by its unique identifier.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Chat by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
    delete:
      operationId: ChatsController_handleDeleteChat
      summary: Delete a chat
      description: Permanently deletes a chat and all its associated messages. This action cannot be undone.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to delete
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Deleted chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/members:
    post:
      operationId: ChatsController_handleAddMembers
      summary: Add members to chat
      description: Adds one or more users to an existing chat. Only available for group and public chats.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      requestBody:
        required: true
        description: List of member IDs to add to the chat
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMemebersDto'
            example:
              members: [5, 6, 7]
      responses:
        '200':
          description: Updated chat with new members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
    delete:
      operationId: ChatsController_handleDeleteMembers
      summary: Remove members from chat
      description: Removes one or more users from an existing chat. Only available for group and public chats.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      requestBody:
        required: true
        description: List of member IDs to remove from the chat
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMemebersDto'
            example:
              members: [5, 6]
      responses:
        '200':
          description: Updated chat with new members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/leave:
    post:
      operationId: ChatsController_handleLeaveChat
      summary: Leave a chat
      description: Allows the authenticated user to leave a group chat. The user will no longer receive messages from this chat.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to leave
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Updated chat with new members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/setActiveValue:
    post:
      operationId: ChatsController_handleSetActiveValue
      summary: Set chat active status
      description: Updates the active status of a chat. Can be used to archive or reactivate a chat.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Updated chat with active value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponseDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/pin:
    post:
      operationId: ChatsController_handlePinChat
      summary: Pin a chat
      description: Pins a chat to the top of the chat list for easy access. Pinned chats appear before unpinned ones.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to pin
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Id of pinned chat
          content:
            application/json:
              schema:
                type: string
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/unpin:
    post:
      operationId: ChatsController_handleUnpinChat
      summary: Unpin a chat
      description: Removes the pinned status from a chat, returning it to its normal position in the chat list.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to unpin
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Id of unpinned chat
          content:
            application/json:
              schema:
                type: string
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/mute:
    post:
      operationId: ChatsController_handleMuteChatChat
      summary: Mute chat notifications
      description: Mutes notifications for a specific chat. The user will no longer receive push notifications for new messages in this chat.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to mute
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Chat settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSettingsDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/chats/{id}/unmute:
    post:
      operationId: ChatsController_handleUnmuteChatChat
      summary: Unmute chat notifications
      description: Re-enables notifications for a previously muted chat. The user will start receiving push notifications for new messages again.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the chat to unmute
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: Chat settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSettingsDto'
      tags:
        - chats
      security:
        - bearer: []
  /messenger/v1/messages:
    get:
      operationId: MessagesController_handleGetMessages
      summary: Get messages from a chat
      description: Retrieves a paginated list of messages from a specific chat. Supports filtering by timestamp and limiting results.
      parameters:
        - name: chatId
          required: true
          in: query
          description: The unique identifier of the chat to retrieve messages from
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
        - name: lastTimestamp
          required: false
          in: query
          description: Retrieve messages older than this timestamp (for pagination)
          schema:
            type: string
          example: "1709043064088"
        - name: firstTimestamp
          required: false
          in: query
          description: Retrieve messages newer than this timestamp
          schema:
            type: string
          example: "1709043000000"
        - name: limit
          required: false
          in: query
          description: Maximum number of messages to return
          schema:
            type: string
          example: "50"
        - name: unreadFirst
          required: false
          in: query
          description: When set to 'true', returns unread messages first
          schema:
            type: string
          example: "true"
      responses:
        '200':
          description: The messages list by chat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
    post:
      operationId: MessagesController_handleCreateMessage
      summary: Send a new message
      description: Creates and sends a new message to a chat. Supports text messages, attachments, replies, and mentions.
      parameters: []
      requestBody:
        required: true
        description: Message content and metadata
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDto'
            example:
              chatId: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
              message: "Hello, world!"
              type: MESSAGE
      responses:
        '200':
          description: The created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
    patch:
      operationId: MessagesController_handleUpdateMessage
      summary: Edit a message
      description: Updates the content of an existing message. Only the message author can edit their messages.
      parameters: []
      requestBody:
        required: true
        description: Updated message content
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDto'
            example:
              id: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
              chatId: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
              message: "Updated message text"
      responses:
        '200':
          description: The updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/readMessages:
    post:
      operationId: MessagesController_handleReadMessages
      summary: Mark messages as read
      description: Marks specific messages as read by the authenticated user. Updates the read status and read receipts.
      parameters: []
      requestBody:
        required: true
        description: List of message IDs to mark as read
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesIdsChatIdDto'
            example:
              chatId: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
              messagesIds: ["msg-id-1", "msg-id-2"]
      responses:
        '200':
          description: The updated message
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessagesIdsChatIdDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/{id}/goToMessage:
    get:
      operationId: MessagesController_handleGoToMessage
      summary: Navigate to a specific message
      description: Retrieves messages surrounding a specific message, useful for jumping to a message in context (e.g., from search results or replies).
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the target message
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
        - name: limit
          required: false
          in: query
          description: Number of messages to return before and after the target message
          schema:
            type: number
          example: 20
      responses:
        '200':
          description: The messages before and after the message with the given id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/forwardMessages:
    post:
      operationId: MessagesController_handleForwardMessages
      summary: Forward messages
      description: Forwards one or more messages to another chat. The forwarded messages will include a reference to the original sender.
      parameters: []
      requestBody:
        required: true
        description: Messages to forward and destination chat
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesIdsChatIdDto'
            example:
              chatId: "destination-chat-id"
              messagesIds: ["msg-id-1", "msg-id-2"]
      responses:
        '200':
          description: The forwarded messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/getPinnedMessages:
    get:
      operationId: MessagesController_handleGetPinnedMessages
      summary: Get pinned messages
      description: Retrieves all messages that have been pinned in a specific chat. Pinned messages are important messages highlighted for easy reference.
      parameters:
        - name: chatId
          required: true
          in: query
          description: The unique identifier of the chat
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: List of pinned messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/{id}/pin:
    post:
      operationId: MessagesController_handlePinMessage
      summary: Pin a message
      description: Pins a message in the chat for easy reference. Pinned messages are highlighted and can be quickly accessed by all chat members.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the message to pin
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: The pinned message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/{id}/unpin:
    post:
      operationId: MessagesController_handleUnpinMessage
      summary: Unpin a message
      description: Removes the pinned status from a message. The message will remain in the chat but will no longer be highlighted.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the message to unpin
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: The unpinned message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/deleteMessages:
    delete:
      operationId: MessagesController_handleDeleteMessages
      summary: Delete multiple messages
      description: Deletes multiple messages at once. Only message authors or chat administrators can delete messages.
      parameters: []
      requestBody:
        required: true
        description: Array of message IDs to delete
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example: ["msg-id-1", "msg-id-2", "msg-id-3"]
      responses:
        '200':
          description: The deleted messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/readAll:
    post:
      operationId: MessagesController_handleReadAll
      summary: Mark all messages as read
      description: Marks all unread messages in a chat as read. Useful for quickly clearing unread message counts.
      parameters: []
      requestBody:
        required: true
        description: The chat to mark as fully read
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatIdDto'
            example:
              chatId: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: The read messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatIdDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/messages/{id}:
    delete:
      operationId: MessagesController_handleDeleteMessage
      summary: Delete a message
      description: Deletes a single message from a chat. Only the message author or chat administrators can delete messages.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the message to delete
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
      responses:
        '200':
          description: The deleted message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - messages
      security:
        - bearer: []
  /messenger/v1/external-lines:
    get:
      operationId: ExternalLinesController_getExternalLines
      summary: Get all external lines
      description: Retrieves a list of all configured external communication lines (e.g., phone numbers, social media integrations).
      parameters: []
      responses:
        '200':
          description: The external lines items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalLineResponseDto'
      tags:
        - external-lines
      security:
        - bearer: []
    post:
      operationId: ExternalLinesController_createExternalLine
      summary: Create an external line
      description: Creates a new external communication line for integrating with external messaging platforms or phone systems.
      parameters: []
      requestBody:
        required: true
        description: External line configuration details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLineCreateDto'
            example:
              name: "Support Line"
              icon: "https://example.com/phone-icon.png"
              phoneNumber: "+1234567890"
              externalId: "support-line-001"
      responses:
        '200':
          description: The created external line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLineResponseDto'
      tags:
        - external-lines
      security:
        - bearer: []
  /messenger/v1/external-lines/{id}:
    get:
      operationId: ExternalLinesController_getExternalLineById
      summary: Get external line by ID
      description: Retrieves detailed information about a specific external communication line.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the external line
          schema:
            type: string
          example: "659ff121fd62e43063340f2f"
      responses:
        '200':
          description: The external line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLineResponseDto'
      tags:
        - external-lines
      security:
        - bearer: []
    delete:
      operationId: ExternalLinesController_deleteExternalLineById
      summary: Delete an external line
      description: Permanently deletes an external communication line. This will disconnect the integration.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the external line to delete
          schema:
            type: string
          example: "659ff121fd62e43063340f2f"
      responses:
        '200':
          description: The deleted external line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLineResponseDto'
      tags:
        - external-lines
      security:
        - bearer: []
    patch:
      operationId: ExternalLinesController_updateExternalLine
      summary: Update an external line
      description: Updates the configuration of an existing external communication line.
      parameters:
        - name: id
          required: true
          in: path
          description: The unique identifier of the external line to update
          schema:
            type: string
          example: "659ff121fd62e43063340f2f"
      requestBody:
        required: true
        description: Updated external line configuration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalLineUpdateDto'
            example:
              name: "Updated Support Line"
              icon: "https://example.com/new-icon.png"
              externalId: "support-line-001"
      responses:
        '200':
          description: The updated external line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalLineResponseDto'
      tags:
        - external-lines
      security:
        - bearer: []
  /messenger/v1/telephony/call/start:
    post:
      operationId: TelephonyController_handleCallStart
      summary: Start a phone call
      description: Initiates a new phone call event. Used to track and manage telephony integration calls.
      parameters: []
      requestBody:
        required: true
        description: Call initiation details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallEventDto'
            example:
              call_type: "outgoing"
              from: "+1234567890"
              to: "+0987654321"
              call_event_id: 1
              auth_user_id: 1
              integration_code: "telephony-001"
              time: "2024-01-30T10:00:00Z"
              status: "started"
      responses:
        '200':
          description: Call started successfully
      tags:
        - telephony
      security:
        - bearer: []
  /messenger/v1/telephony/call/end:
    post:
      operationId: TelephonyController_handleCallEnd
      summary: End a phone call
      description: Records the end of a phone call event. Used to update call records with duration and status.
      parameters: []
      requestBody:
        required: true
        description: Call termination details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallEventDto'
            example:
              call_type: "outgoing"
              from: "+1234567890"
              to: "+0987654321"
              call_event_id: 1
              auth_user_id: 1
              integration_code: "telephony-001"
              time: "2024-01-30T10:05:00Z"
              status: "completed"
      responses:
        '200':
          description: Call ended successfully
      tags:
        - telephony
      security:
        - bearer: []
  /messenger/v1/search/messages:
    get:
      operationId: SearchController_handleSearchMessages
      summary: Search messages globally
      description: Searches for messages across all chats accessible to the authenticated user. Supports filtering by date and limiting results.
      parameters:
        - name: query
          required: true
          in: query
          description: The search query string to match against message content
          schema:
            type: string
          example: "meeting tomorrow"
        - name: limit
          required: true
          in: query
          description: Maximum number of results to return
          schema:
            type: string
          example: "20"
        - name: date
          required: true
          in: query
          description: Filter messages by date (ISO 8601 format)
          schema:
            type: string
          example: "2024-01-30"
      responses:
        '200':
          description: List of matching messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponseDto'
      tags:
        - search
      security:
        - bearer: []
  /messenger/v1/search/{chatId}:
    get:
      operationId: SearchController_handleSearchAll
      summary: Search within a specific chat
      description: Searches for messages, files, and links within a specific chat. Returns categorized results for easy filtering.
      parameters:
        - name: query
          required: true
          in: query
          description: The search query string to match against chat content
          schema:
            type: string
          example: "project update"
        - name: chatId
          required: true
          in: path
          description: The unique identifier of the chat to search within
          schema:
            type: string
          example: "76bfc2ff-207c-4b5a-8543-f7009b7f8872"
        - name: limit
          required: true
          in: query
          description: Maximum number of results to return per category
          schema:
            type: number
          example: 20
        - name: date
          required: true
          in: query
          description: Filter results by date (ISO 8601 format)
          schema:
            type: string
          example: "2024-01-30"
      responses:
        '200':
          description: Search results categorized by messages, files, and links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
      tags:
        - search
      security:
        - bearer: []
info:
